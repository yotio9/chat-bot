[project]
name = "chat-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hotyotio@gmail.com", email = "hotyotio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "ffmpeg>=1.4",
    "ngrok>=1.7.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "uvicorn>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
chat-bot = "chat_bot:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
